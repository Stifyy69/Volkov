<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Volkov Panel RP</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .active { background: #d4ffd4; margin: 10px 0; padding: 8px; border-radius: 6px; }
    .drill { background: #d4e9ff; margin: 10px 0; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>Plată Taxe</h2>
  <form id="taxeForm">
    <label>CNP (max 6):</label><br>
    <input type="text" id="cnp" maxlength="6" required><br><br>

    <label>Metodă de plată:</label><br>
    <select id="metoda">
      <option value="CLEAN">Bani curați - 40.000$</option>
      <option value="DIRTY">Bani murdari - 60.000$</option>
      <option value="FREE">Gratis</option>
    </select><br><br>

    <div id="familieDiv" style="display:none">
      <label>Alege Familia:</label><br>
      <select id="familie">
        <option value="Medelin">Medelin</option>
        <option value="818">818</option>
        <option value="Stefanos">Stefanos</option>
      </select><br><br>
    </div>

    <button type="submit">Trimite</button>
  </form>

  <h3>Taxe active</h3>
  <div id="active"></div>

  <hr>

  <h2>Burghiu</h2>
  <form id="drillForm">
    <label>CNP:</label><br>
    <input type="text" id="drillCnp" maxlength="6" required><br><br>

    <label>Piesă:</label><br>
    <select id="part">
      <option value="CADRU">Cadru</option>
      <option value="TEAVA">Țeavă</option>
      <option value="MECANISM">Mecanism</option>
      <option value="FIXARE">Elemente Fixare</option>
    </select><br><br>

    <label>Familie:</label><br>
    <select id="drillFamily">
      <option value="Medelin">Medelin</option>
      <option value="Stefanos">Stefanos</option>
      <option value="Bogota Thugs">Bogota Thugs</option>
      <option value="LowLine">LowLine</option>
      <option value="Casa Blanca">Casa Blanca</option>
      <option value="LaPuentes">LaPuentes</option>
      <option value="Mali Strip">Mali Strip</option>
      <option value="Garda Veche">Garda Veche</option>
      <option value="NDR">NDR</option>
      <option value="Velvet">Velvet</option>
      <option value="Santos Gruppo">Santos Gruppo</option>
      <option value="Mayans MC">Mayans MC</option>
      <option value="La CosaNostra">La CosaNostra</option>
      <option value="Hells Riders">Hells Riders</option>
      <option value="BACM">BACM</option>
    </select><br><br>

    <label>Cantitate:</label><br>
    <input type="number" id="quantity" min="1" required><br><br>

    <button type="submit">Adaugă</button>
  </form>

  <h3>Burghiu Jobs</h3>
  <div id="drillJobs"></div>

  <script>
    // TAXE
    const form = document.getElementById("taxeForm");
    const metodaSel = document.getElementById("metoda");
    const familieDiv = document.getElementById("familieDiv");

    metodaSel.addEventListener("change", () => {
      familieDiv.style.display = metodaSel.value === "FREE" ? "block" : "none";
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const data = {
        cnp: document.getElementById("cnp").value,
        metoda: metodaSel.value,
        family: metodaSel.value === "FREE" ? document.getElementById("familie").value : null
      };
      await fetch("/taxe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      loadTaxe();
    });

    async function loadTaxe() {
      const res = await fetch("/taxe");
      const list = await res.json();
      const div = document.getElementById("active");
      div.innerHTML = "";
      list.forEach(t => {
        div.innerHTML += `<div class="active">CNP ${t.cnp} - ${t.metoda} ${t.amount}$ ${t.family ?? ""} (expiră în ${t.timeLeft})</div>`;
      });
    }

    // BURGHIU
    const drillForm = document.getElementById("drillForm");
    drillForm.addEventListener("submit", async e => {
      e.preventDefault();
      const data = {
        cnp: document.getElementById("drillCnp").value,
        part: document.getElementById("part").value,
        family: document.getElementById("drillFamily").value,
        quantity: parseInt(document.getElementById("quantity").value)
      };
      await fetch("/drill", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      loadDrill();
    });

    async function loadDrill() {
      const res = await fetch("/drill");
      const list = await res.json();
      const div = document.getElementById("drillJobs");
      div.innerHTML = "";
      list.forEach(j => {
        div.innerHTML += `<div class="drill">CNP ${j.cnp} - ${j.part} x${j.quantity} (${j.family})</div>`;
      });
    }

    loadTaxe();
    loadDrill();
  </script>
</body>
</html>
