<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Volkov · /taxe</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>/taxe</h1>
        <div id="status" class="status">offline</div>
      </header>

      <form id="taxe-form" autocomplete="off" novalidate>
        <div class="grid">
          <label>
            <span>CNP</span>
            <input type="text" name="cnp" maxlength="13" placeholder="13 cifre" required />
            <small class="hint">Trebuie să aibă 13 cifre și să treacă cifra de control.</small>
          </label>

          <label>
            <span>Nume</span>
            <input type="text" name="nume" placeholder="Nume complet" />
          </label>

          <label>
            <span>Suma</span>
            <input type="number" step="0.01" name="suma" placeholder="0.00" required />
          </label>

          <label>
            <span>Tip sumă</span>
            <select name="tip_suma">
              <option value="net">Net</option>
              <option value="brut">Brut</option>
            </select>
          </label>

          <label>
            <span>Acțiune</span>
            <select name="actiune">
              <option value="clean">Bani curați</option>
              <option value="dirty">Bani murdari</option>
              <option value="check">Verificare taxă</option>
              <option value="materials">Materiale</option>
            </select>
          </label>

          <label>
            <span>Procent taxă (%)</span>
            <input type="number" step="0.01" name="procent" placeholder="10" />
          </label>

          <label class="full">
            <span>Observații</span>
            <input type="text" name="observatii" placeholder="optional" />
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="primary">Calculează & Loghează</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </form>

      <section class="result" id="result" hidden>
        <h2>Rezultat</h2>
        <div id="result-body"></div>
      </section>

      <section class="logs">
        <h2>Ultimele acțiuni</h2>
        <pre id="log">ready.</pre>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
