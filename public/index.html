<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volkov · /taxe</title>
    <style>
      :root { --bg:#0b0d10; --card:#12161c; --muted:#9aa4b2; --fg:#e6edf3; --accent:#4f8cff; }
      *{box-sizing:border-box} html,body{height:100%}
      body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto}
      .wrap{max-width:720px;margin:48px auto;padding:0 20px}
      .card{background:var(--card);border:1px solid #202632;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
      .head{padding:20px 22px;border-bottom:1px solid #202632;display:flex;justify-content:space-between;align-items:center}
      .head h1{font-size:18px;margin:0}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:18px}
      button{appearance:none;border:1px solid #273040;background:#171c23;color:var(--fg);
             border-radius:12px;padding:14px 16px;font-weight:600;cursor:pointer;transition:.15s}
      button:hover{transform:translateY(-1px)}
      button:active{transform:translateY(0)}
      .primary{background:var(--accent);border-color:var(--accent);color:#fff}
      .muted{color:var(--muted)}
      .log{padding:16px 18px;border-top:1px dashed #263142;font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
           font-size:13px;max-height:180px;overflow:auto;white-space:pre-wrap}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="head">
          <h1>/taxe</h1>
          <span class="muted" id="status">…</span>
        </div>
        <div class="grid">
          <button class="primary" data-action="clean">Bani curați</button>
          <button class="primary" data-action="dirty">Bani murdari</button>
          <button data-action="check">Verificare taxă</button>
          <button data-action="materials">Materiale</button>
        </div>
        <div class="log" id="log">ready.</div>
      </div>
    </div>

    <script>
      const $s = document.getElementById('status');
      const $log = document.getElementById('log');
      const log = (m) => $log.textContent = `[${new Date().toLocaleTimeString()}] ${m}\n` + $log.textContent;

      async function ping() {
        try {
          const r = await fetch('/health');
          if (!r.ok) throw new Error(r.status);
          const j = await r.json();
          $s.textContent = j.ok ? 'online' : 'offline';
        } catch { $s.textContent = 'offline'; }
      }

      async function hit(action) {
        const r = await fetch(`/taxe/${action}`, { method: 'POST' });
        const j = await r.json().catch(() => ({}));
        if (r.ok) log(`${action} → OK`);
        else log(`${action} → EROARE ${r.status} ${j.message || ''}`);
      }

      document.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => hit(btn.dataset.action));
      });

      ping(); setInterval(ping, 8000);
    </script>
  </body>
</html>
