<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Volkov RP Panel</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card" id="authCard">
      <h2>Autentificare</h2>
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <div id="loginPane">
        <label>Username<input id="loginUser" /></label>
        <label>Parola<input id="loginPass" type="password" /></label>
        <button id="btnLogin" class="primary">Login</button>
      </div>

      <div id="registerPane" class="hidden">
        <label>Invite code<input id="regInvite" /></label>
        <label>Username<input id="regUser" /></label>
        <label>Parola<input id="regPass" type="password" /></label>
        <label>Nickname<input id="regNick" /></label>
        <label>CNP (max 6)<input id="regCnp" maxlength="6" inputmode="numeric" pattern="\\d{1,6}" /></label>
        <button id="btnRegister" class="primary">Register</button>
      </div>

      <div id="adminInvite" class="hidden">
        <h3>Invite generator</h3>
        <label>Rol
          <select id="inviteRole">
            <option value="OPERATOR">OPERATOR</option>
            <option value="HEAD_OPERATOR">HEAD_OPERATOR</option>
            <option value="AUDIT">AUDIT</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </label>
        <button id="btnMakeInvite">Generează</button>
        <div id="inviteOut" class="mono"></div>
      </div>
    </section>

    <section class="card hidden" id="panelCard">
      <div class="topbar">
        <div id="whoami"></div>
        <button id="logout" class="ghost">Logout</button>
      </div>

      <h2>Taxe</h2>
      <div class="row">
        <label>CNP<input id="cnp" maxlength="6" inputmode="numeric" pattern="\\d{1,6}" /></label>
        <label>Metodă
          <select id="metoda">
            <option value="card">Card</option>
            <option value="numerar">Numerar</option>
            <option value="transfer">Transfer</option>
            <option value="gratis">Gratis</option>
          </select>
        </label>
        <label id="gratisBox" class="hidden">Familie (doar Gratis)
          <select id="gratisFamilie">
            <option>Medelin Cartel</option>
            <option>818</option>
            <option>Stefanos Cartel</option>
          </select>
        </label>
      </div>
      <div class="grid">
        <button class="opt" data-opt="curat">Bani curați – 40.000 $</button>
        <button class="opt" data-opt="murdar">Bani murdari – 60.000 $</button>
        <button class="opt" data-opt="otel">Oțel – 15 buc</button>
        <button class="opt" data-opt="praf">Praf de pușcă – 25 buc</button>
      </div>

      <h3>Active</h3>
      <ul id="taxeList"></ul>

      <hr/>
      <h2>Burghiu</h2>
      <div class="row">
        <label>CNP<input id="drCnp" maxlength="6" inputmode="numeric" pattern="\\d{1,6}" /></label>
        <label>Piesă
          <select id="drPart">
            <option value="cadru">Cadru</option>
            <option value="teava">Țeavă</option>
            <option value="mecanism">Mecanism</option>
            <option value="fixare">Elemente de fixare</option>
          </select>
        </label>
        <label>Familie
          <select id="drFamilie"></select>
        </label>
        <label>Cantitate<input type="number" id="drQty" min="1" value="1"/></label>
        <label>CashType
          <select id="drCash">
            <option value="CLEAN">CLEAN</option>
            <option value="DIRTY">DIRTY</option>
          </select>
        </label>
        <button id="btnDrill" class="primary">Trimite</button>
      </div>

      <h3>Ultimele joburi</h3>
      <ul id="drillList"></ul>
    </section>
  </main>

  <script>
    const api = (path, opts={}) => fetch(path, { ...opts, headers: { "Content-Type":"application/json", ...(opts.headers||{}), ...(localStorage.token?{Authorization:"Bearer "+localStorage.token}:{}) }});
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const show = (el, v) => el.classList.toggle('hidden', !v);

    const authCard = $('#authCard');
    const panelCard = $('#panelCard');
    const adminInvite = $('#adminInvite');

    $$('.tab').forEach(t => t.onclick = () => {
      $$('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      show($('#loginPane'), t.dataset.tab==='login');
      show($('#registerPane'), t.dataset.tab==='register');
    });

    $('#btnLogin').onclick = async () => {
      const r = await api('/auth/login', { method:'POST', body: JSON.stringify({ username: $('#loginUser').value, password: $('#loginPass').value }) });
      const j = await r.json();
      if(!r.ok){ alert(j.error||'err'); return; }
      localStorage.token = j.token; await bootstrap();
    };

    $('#btnRegister').onclick = async () => {
      const payload = {
        inviteCode: $('#regInvite').value,
        username: $('#regUser').value,
        password: $('#regPass').value,
        nickname: $('#regNick').value,
        cnp: $('#regCnp').value
      };
      const r = await api('/auth/register', { method:'POST', body: JSON.stringify(payload) });
      const j = await r.json();
      if(!r.ok){ alert(j.error||'err'); return; }
      localStorage.token = j.token; await bootstrap();
    };

    $('#logout').onclick = () => { localStorage.removeItem('token'); location.reload(); };

    $('#metoda').onchange = () => { $('#gratisBox').classList.toggle('hidden', $('#metoda').value!=='gratis'); };

    $$('.opt').forEach(btn => btn.onclick = async (e) => {
      e.preventDefault();
      const cnp = $('#cnp').value.trim();
      if(!/^\d{1,6}$/.test(cnp)){ alert('CNP invalid'); return; }
      const body = { cnp, metoda: $('#metoda').value, optiune: btn.dataset.opt };
      if (body.metoda === 'gratis') body.gratisFamilie = $('#gratisFamilie').value;
      const r = await api('/taxe', { method:'POST', body: JSON.stringify(body) });
      const j = await r.json();
      if(!r.ok){ alert(j.error||'err'); return; }
      await loadTaxe();
    });

    $('#btnDrill').onclick = async () => {
      const payload = {
        cnp: $('#drCnp').value.trim(),
        part: $('#drPart').value,
        family: $('#drFamilie').value || null,
        quantity: Number($('#drQty').value||0),
        cashType: $('#drCash').value
      };
      if(!/^\d{1,6}$/.test(payload.cnp)){ alert('CNP invalid'); return; }
      const r = await api('/drill', { method:'POST', body: JSON.stringify(payload) });
      const j = await r.json(); if(!r.ok){ alert(j.error||'err'); return; }
      await loadDrill();
    };

    $('#btnMakeInvite')?.addEventListener('click', async ()=>{
      const r = await api('/invites', { method:'POST', body: JSON.stringify({ role: $('#inviteRole').value }) });
      const j = await r.json(); if(!r.ok){ alert(j.error||'err'); return; }
      $('#inviteOut').textContent = j.link || j.code;
    });

    async function bootstrap(){
      const r = await api('/auth/me');
      const me = await r.json();
      if(!r.ok){ localStorage.removeItem('token'); return; }
      $('#whoami').textContent = `${me.username} [${me.role}]`;
      show(authCard, false);
      show(panelCard, true);
      show(adminInvite, me.role==='ADMIN' || me.role==='HEAD_OPERATOR');
      await loadFamilies();
      await loadTaxe();
      await loadDrill();
    }

    async function loadFamilies(){
      const r = await api('/families');
      const list = await r.json();
      const sel = $('#drFamilie');
      sel.innerHTML = '<option value="">(fără)</option>' + list.map(f=>`<option value="${f.name}">${f.name}</option>`).join('');
    }

    async function loadTaxe(){
      const r = await api('/taxe');
      const data = await r.json();
      const ul = $('#taxeList'); ul.innerHTML = '';
      data.forEach(x=>{
        const li = document.createElement('li');
        li.textContent = `${x.cnp} — ${x.tip} (${x.amount}) — ${x.metoda}${x.gratisFamilie?` / Gratis: ${x.gratisFamilie}`:''} — ${x.remaining}`;
        ul.appendChild(li);
      });
    }

    async function loadDrill(){
      const r = await api('/drill');
      const data = await r.json();
      const ul = $('#drillList'); ul.innerHTML='';
      data.forEach(j=>{
        const txt = `#${j.id} CNP ${j.cnp} | cadru:${j.cadru} mecanism:${j.mecanism} teava:${j.teava} fixare:${j.fixare} | qty:${j.qty} | ${j.family||'-'} | ${j.cashType}`;
        const li = document.createElement('li'); li.textContent = txt; ul.appendChild(li);
      });
    }

    (async () => {
      const params = new URLSearchParams(location.search);
      const invite = params.get('invite'); if(invite) { $$('.tab')[1].click(); $('#regInvite').value = invite; }
      if(localStorage.token){ await bootstrap(); }
    })();
  </script>
</body>
</html>
