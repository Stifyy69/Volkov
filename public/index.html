<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Dashboard</h1>
      <nav>
        <button data-tab="dashboard">Dashboard</button>
        <button data-tab="taxe">Taxe</button>
        <button data-tab="drill">Burghiu</button>
        <button data-tab="tables">Tabele</button>
        <button data-tab="admin">Admin</button>
        <button data-tab="profile">Profil</button>
        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main>
      <section id="loginView">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="text" id="username" placeholder="Username" required>
          <input type="password" id="password" placeholder="Parola" required>
          <button type="submit">Login</button>
        </form>
        <p id="loginError"></p>
      </section>

      <section id="dashboardView" class="hidden"></section>
      <section id="taxeView" class="hidden"></section>
      <section id="drillView" class="hidden"></section>
      <section id="tablesView" class="hidden"></section>
      <section id="adminView" class="hidden"></section>
      <section id="profileView" class="hidden"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
