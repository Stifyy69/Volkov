<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxe & Burghiu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">
  <nav>
    <button data-tab="taxe">Taxe</button>
    <button data-tab="drill">Burghiu</button>
    <button data-tab="dashboard">Dashboard</button>
    <button data-tab="admin">Admin</button>
    <button id="logoutBtn" class="right">Logout</button>
  </nav>

  <!-- === TAXE === -->
  <section id="tab-taxe" class="tab active">
    <h2>Adaugă Taxă</h2>
    <form id="taxeForm">
      <input type="text" name="cnp" placeholder="CNP (max 6 cifre)" required />
      <select name="metoda" id="metodaSelect" required>
        <option value="">Alege metoda de plată</option>
        <option value="curat">Bani curați - 40.000$</option>
        <option value="murdar">Bani murdari - 60.000$</option>
        <option value="otel">Oțel - 15 buc</option>
        <option value="praf">Praf - 25 buc</option>
        <option value="gratis">Gratis (familie)</option>
      </select>

      <!-- Familiile doar dacă alegi Gratis -->
      <select name="gratisFamilie" id="gratisSelect" style="display:none;">
        <option value="">Selectează familia</option>
        <option value="Medelin Cartel">Medelin Cartel</option>
        <option value="818">818</option>
        <option value="Stefanos Cartel">Stefanos Cartel</option>
      </select>

      <button type="submit">Trimite Taxa</button>
    </form>

    <h3>Taxe active</h3>
    <table id="taxeTable">
      <thead>
        <tr>
          <th>CNP</th>
          <th>Sumă</th>
          <th>Timp rămas</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- === BURGHIU === -->
  <section id="tab-drill" class="tab">
    <h2>Burghiu</h2>
    <form id="drillForm">
      <input type="text" name="cnp" placeholder="CNP (max 6 cifre)" required />
      <input type="number" name="quantity" placeholder="Cantitate" required min="1" />
      <select name="part" required>
        <option value="">Selectează piesa</option>
        <option value="cadru">Cadru</option>
        <option value="teava">Țeavă</option>
        <option value="mecanism">Mecanism</option>
        <option value="fixare">Elemente de fixare</option>
      </select>
      <select name="family">
        <option value="">Fără familie</option>
        <option value="Medelin Cartel">Medelin Cartel</option>
        <option value="818">818</option>
        <option value="Stefanos Cartel">Stefanos Cartel</option>
      </select>
      <button type="submit">Trimite Job</button>
    </form>

    <h3>Job-uri Burghiu</h3>
    <table id="drillTable">
      <thead>
        <tr>
          <th>CNP</th>
          <th>Familie</th>
          <th>Cadru</th>
          <th>Țeavă</th>
          <th>Mecanism</th>
          <th>Fixare</th>
          <th>Metodă plată</th>
          <th>Cost Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- === DASHBOARD === -->
  <section id="tab-dashboard" class="tab">
    <h2>Dashboard</h2>
    <div id="dashboardContent">
      <p>Încărcare date...</p>
    </div>
    <canvas id="chartFamilies" width="400" height="200"></canvas>
    <canvas id="chartWeekly" width="400" height="200"></canvas>
  </section>

  <!-- === ADMIN === -->
  <section id="tab-admin" class="tab">
    <h2>Admin Control</h2>
    <input type="text" id="searchInput" placeholder="Caută după username sau CNP" />
    <div id="adminResults"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
